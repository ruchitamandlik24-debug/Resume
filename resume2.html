<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Digital Resume Builder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* ---------------------------------- */
        /* CSS Styling: Elite Digital Theme */
        /* ---------------------------------- */
        :root {
            --primary-color: #42a5f5; /* Bright Electric Blue */
            --secondary-color: #1a237e; /* Deep Indigo/Navy */
            --background-color: #e3f2fd; /* Very Light Blue Background */
            --sidebar-color: #1a237e; /* Deep Indigo for a strong contrast sidebar */
            --accent-color: #81d4fa; /* Lighter Blue Accent */
            --text-dark: #263238;
            --text-light: #eceff1; /* White/Off-White for text on dark sidebar */
            --text-muted: #546e7a; /* Muted text for details */
        }

        body {
            font-family: 'Open Sans', sans-serif; /* Readable body font */
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: var(--background-color);
        }

        /* Container & Layout */
        .container {
            max-width: 1100px; /* Slightly wider */
            margin: 40px auto;
            background-color: #fff;
            box-shadow: 0 20px 40px rgba(26, 35, 126, 0.15); /* Shadow matching secondary color */
            border-radius: 12px; /* More rounded corners */
            overflow: hidden;
            display: flex;
            min-height: 800px; /* Ensure a decent height for display */
        }

        /* 🌟 Input Form Styling 🌟 */
        .form-section {
            padding: 40px;
            background-color: #fff;
            width: 100%;
            display: block;
            font-family: 'Montserrat', sans-serif;
        }

        .form-section h2 {
            color: var(--secondary-color);
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .form-section label {
            display: block;
            margin-top: 15px;
            font-weight: 600; /* Bolder label */
            color: var(--text-dark);
            font-size: 0.95em;
        }

        .form-section input, .form-section textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-section input:focus, .form-section textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(66, 165, 245, 0.5); /* Focus glow */
            outline: none;
        }

        .form-section button {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 8px; /* Slightly more rounded */
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            margin-top: 30px;
            transition: background-color 0.3s ease, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .form-section button:hover {
            background-color: #1e88e5; /* Darker blue on hover */
            transform: translateY(-2px); /* More noticeable lift effect */
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
        }

        /* 📝 Resume Layout 📝 */
        .resume-section {
            display: none;
            flex-direction: column;
            width: 100%;
        }

        .resume-body {
            display: flex;
            width: 100%;
        }

        /* Sidebar - Contact, Education, Skills */
        .sidebar {
            width: 35%;
            padding: 40px 30px;
            background-color: var(--sidebar-color); /* Deep Indigo */
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
        }

        .sidebar-section h4 {
            color: var(--accent-color);
            border-bottom: 2px solid var(--primary-color); /* Bright blue accent line */
            padding-bottom: 8px;
            margin-top: 35px;
            margin-bottom: 15px;
            font-size: 1.15em;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
        }
        .sidebar-section:first-child h4 { margin-top: 0; }

        .contact-item {
            margin-bottom: 10px;
            font-size: 0.9em;
        }
        .contact-item i {
            width: 20px;
            color: var(--primary-color);
            margin-right: 5px;
        }
        .contact-item span, .contact-item a {
            color: var(--text-light);
            text-decoration: none;
            word-break: break-all;
            transition: color 0.2s;
        }
        .contact-item a:hover { color: var(--accent-color); }

        /* Skills Chips (New Element) */
        .skills-list {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .skill-chip {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        
        /* FIX: Enhanced visibility for Education section on dark sidebar */
        .sidebar-section .entry h4 {
            margin: 0;
            font-size: 1.2em;
            /* Using pure white for the Degree/Job Title */
            color: var(--text-light); 
            font-weight: 700;
        }
        .sidebar-section .entry p.subtitle {
            margin: 5px 0;
            font-style: italic;
            /* Using the light accent blue for the College Name/Years */
            color: var(--accent-color); 
            display: flex;
            justify-content: space-between;
            font-size: 0.95em;
        }


        /* Main Content - Header, Summary, Experience */
        .main-content {
            width: 65%;
            padding: 40px;
            font-family: 'Open Sans', sans-serif;
            color: var(--text-dark);
        }

        /* Header */
        .header {
            padding-bottom: 15px;
            margin-bottom: 30px;
            border-bottom: 4px solid var(--primary-color);
        }

        .header h1 {
            margin: 0;
            color: var(--secondary-color);
            font-size: 3.5em; /* Larger name */
            font-weight: 700;
            letter-spacing: 2px;
            font-family: 'Montserrat', sans-serif;
        }

        .header h2 {
            margin: 5px 0 0 0;
            color: var(--primary-color); /* Title stands out */
            font-size: 1.5em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* General Section Styling */
        .main-content-section h3 {
            color: var(--secondary-color);
            text-transform: uppercase;
            font-size: 1.6em; /* Bolder section title */
            margin-top: 35px;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--accent-color);
            font-weight: 700;
            letter-spacing: 0.5px;
            font-family: 'Montserrat', sans-serif;
        }

        /* Experience/Education Entry */
        .entry {
            margin-bottom: 25px;
            transition: background-color 0.3s;
            padding-left: 5px;
            border-left: 3px solid transparent;
        }
        /* Subtle hover effect for entries to simulate digital interaction */
        .entry:hover {
             border-left: 3px solid var(--primary-color);
             background-color: rgba(66, 165, 245, 0.05);
        }

        .main-content .entry h4 {
            margin: 0;
            font-size: 1.2em;
            color: var(--secondary-color);
            font-weight: 700;
        }
        .main-content .entry p.subtitle {
            margin: 5px 0;
            font-style: italic;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            font-size: 0.95em;
        }
        .entry ul {
            list-style-type: none;
            padding-left: 0;
            margin-top: 10px;
            font-size: 0.95em;
        }
        .entry ul li {
            padding-left: 1.2em;
            text-indent: -1.2em;
            margin-bottom: 5px;
        }
        .entry ul li:before {
            content: "➤"; /* Using a modern arrow/pointer */
            color: var(--primary-color);
            font-weight: bold;
            display: inline-block;
            width: 1em;
            margin-right: 0.2em;
            font-size: 0.8em;
            line-height: 1;
        }

        /* Summary text */
        .main-content-section p {
            margin-top: 10px;
            color: var(--text-dark);
        }

        /* Footer Buttons (Print/New Resume) */
        .resume-section > div:last-child {
             padding: 20px;
             text-align: center;
             border-top: 1px solid #ddd;
        }

        .resume-section > div:last-child button {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            margin: 10px 5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .resume-section > div:last-child button:hover {
            background-color: #1e88e5;
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
        }

        .resume-section > div:last-child button:nth-child(2) {
            background-color: var(--text-muted);
        }
        .resume-section > div:last-child button:nth-child(2):hover {
            background-color: #607d8b;
            box-shadow: 0 4px 8px rgba(84, 110, 122, 0.4);
        }

        .hidden {
            display: none !important;
        }

        /* Print Optimization */
        @media print {
            body { background-color: #fff; padding: 0; }
            .form-section, .resume-section > div:last-child {
                display: none !important;
            }
            .container {
                box-shadow: none;
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
            }
            .sidebar { padding: 30px 20px; }
            .main-content { padding: 30px 40px 30px 20px; }
            
            /* Print style: Change sidebar to white background but keep structure/accents */
            .sidebar {
                background-color: #fff;
                color: var(--text-dark);
                border-right: 1px solid var(--accent-color);
            }
            .contact-item span, .contact-item a {
                color: var(--text-dark) !important;
            }
            .sidebar-section .entry h4 {
                color: var(--secondary-color) !important;
            }
            .sidebar-section .entry p.subtitle {
                color: var(--text-muted) !important;
            }
        }
    </style>
</head>
<body>

    <div class="container form-section">
        <h2>Resume Information Input</h2>
        <form id="resumeForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" required>

            <label for="title">Professional Title (e.g., Software Engineer):</label>
            <input type="text" id="title" required>

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone">

            <label for="linkedin">LinkedIn URL:</label>
            <input type="url" id="linkedin">

            <label for="summary">Professional Summary/Objective:</label>
            <textarea id="summary" rows="4" required></textarea>

            <h3>Technical Skills (Comma-separated: HTML, CSS, JavaScript, etc.)</h3>
            <label for="skills">Skills:</label>
            <input type="text" id="skills">

            <h3>Latest Experience</h3>
            <label for="job-title">Job Title:</label>
            <input type="text" id="job-title">
            <label for="company">Company:</label>
            <input type="text" id="company">
            <label for="job-years">Years Worked (e.g., 2022 - Present):</label>
            <input type="text" id="job-years">
            <label for="job-details">Key Achievements (Use **|** to separate points):</label>
            <textarea id="job-details" rows="3"></textarea>

            <h3>Latest Education</h3>
            <label for="degree">Degree (e.g., B.Tech. in IT):</label>
            <input type="text" id="degree">
            <label for="university">University/Institution:</label>
            <input type="text" id="university">
            <label for="edu-years">Years Attended (e.g., 2018 - 2022):</label>
            <input type="text" id="edu-years">

            <button type="submit">Generate Elite Resume ✨</button>
        </form>
    </div>

    <div class="container resume-section hidden">
        <div id="resumeOutput" class="resume-body">
            </div>
        <div style="text-align: center;">
            <button onclick="window.print()">Print/Save as PDF 🖨️</button>
            <button onclick="window.location.reload()">Start New Resume</button>
        </div>
    </div>

    <script>
        // ----------------------------------
        // JavaScript Logic
        // ----------------------------------
        document.getElementById('resumeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            generateResume();
        });

        function generateResume() {
            const data = {
                name: document.getElementById('name').value,
                title: document.getElementById('title').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                linkedin: document.getElementById('linkedin').value,
                summary: document.getElementById('summary').value,
                skills: document.getElementById('skills').value,

                jobTitle: document.getElementById('job-title').value,
                company: document.getElementById('company').value,
                jobYears: document.getElementById('job-years').value,
                jobDetails: document.getElementById('job-details').value,

                degree: document.getElementById('degree').value,
                university: document.getElementById('university').value,
                eduYears: document.getElementById('edu-years').value,
            };

            // Helper function to create skill chips
            function createSkillChips(skillsString) {
                if (!skillsString) return '';
                const skillsArray = skillsString.split(',').map(skill => skill.trim()).filter(skill => skill.length > 0);
                return `
                    <div class="skills-list">
                        ${skillsArray.map(skill => `<span class="skill-chip">${skill}</span>`).join('')}
                    </div>
                `;
            }

            // 1. Build Resume Structure (Two-Column Layout)
            let html = `
                <div class="sidebar">
                    <div class="sidebar-section">
                        <h4>CONTACT</h4>
                        ${data.phone ? `<p class="contact-item"><i class="fas fa-phone"></i><span>${data.phone}</span></p>` : ''}
                        ${data.email ? `<p class="contact-item"><i class="fas fa-envelope"></i><a href="mailto:${data.email}">${data.email}</a></p>` : ''}
                        ${data.linkedin ? `<p class="contact-item"><i class="fab fa-linkedin"></i><a href="${data.linkedin}" target="_blank">LinkedIn Profile</a></p>` : ''}
                    </div>

                    ${data.skills ? `
                    <div class="sidebar-section">
                        <h4>SKILLS</h4>
                        ${createSkillChips(data.skills)}
                    </div>
                    ` : ''}

                    ${(data.degree && data.university) ? `
                    <div class="sidebar-section">
                        <h4>EDUCATION</h4>
                        <div class="entry">
                            <h4>${data.degree}</h4>
                            <p class="subtitle">
                                <span>${data.university}</span>
                                <span class="years">${data.eduYears}</span>
                            </p>
                        </div>
                    </div>
                    ` : ''}

                </div>

                <div class="main-content">
                    <div class="header">
                        <h1>${data.name}</h1>
                        <h2>${data.title}</h2>
                    </div>

                    ${data.summary ? `
                    <div class="main-content-section">
                        <h3>SUMMARY</h3>
                        <p>${data.summary}</p>
                    </div>
                    ` : ''}

                    ${(data.jobTitle && data.company) ? `
                    <div class="main-content-section">
                        <h3>EXPERIENCE</h3>
                        <div class="entry">
                            <h4>${data.jobTitle}</h4>
                            <p class="subtitle">
                                <span>${data.company}</span>
                                <span class="years">${data.jobYears}</span>
                            </p>
                            ${data.jobDetails ? `
                            <ul>
                                ${data.jobDetails.split('|').map(point => point.trim()).filter(point => point.length > 0).map(point => `<li>${point}</li>`).join('')}
                            </ul>
                            ` : ''}
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;

            // 2. Render and Show
            document.getElementById('resumeOutput').innerHTML = html;
            document.querySelector('.form-section').classList.add('hidden');
            document.querySelector('.resume-section').classList.remove('hidden');
            document.querySelector('.resume-section').style.display = 'flex';
        }
    </script>
</body>
</html>
